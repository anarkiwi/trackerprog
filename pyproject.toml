[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trackerprog"
version = "0.1.0"
description = "SID tune decompilation on deity-informant's 6510 P-Code VM: tuneprog (a .sid as a certified per-tick program) and trackerprog (that program bound to one universal tracker player)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Josh Bailey", email = "josh@overlyspecific.com" }]
keywords = ["6502", "6510", "c64", "sid", "decompiler", "tracker", "pcode"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["deity-informant>=0.5.0", "jennings>=0.1.0", "numpy", "networkx"]

[project.optional-dependencies]
oracle = ["pysidtracker", "zstandard"]
dev = ["pytest", "pytest-xdist", "pytest-cov", "build", "black", "pylint", "pypcode"]

[project.urls]
Homepage = "https://github.com/anarkiwi/trackerprog"
Repository = "https://github.com/anarkiwi/trackerprog"

[project.scripts]
tuneprog = "tuneprog.pipeline:main"

[tool.setuptools.packages.find]
include = ["tuneprog*", "trackerprog*"]

[tool.pytest.ini_options]
markers = [
    "oracle: byte-exact SID grid vs the Dockerized sidtrace oracle (needs Docker + HVSC)",
    "hvsc: tuneprog front end on real HVSC tunes (needs an HVSC tree or the tune cache)",
]

[tool.coverage.run]
source = ["tuneprog", "trackerprog"]

[tool.black]
line-length = 100

[tool.pylint.main]
jobs = 0

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["A", "X", "Y", "S", "SP", "C", "e", "vm", "op", "mn", "md", "t", "v", "r", "pc", "L"]

[tool.pylint."messages control"]
# missing-docstring off: short helpers (C/e/nz) and tests carry no docstrings.
# unidiomatic-typecheck off: the tuneprog IR dispatches on exact node type over a
# closed set of dataclasses, where isinstance would be both looser and slower.
disable = [
    "unidiomatic-typecheck",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "invalid-name",
    "consider-using-f-string",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-lines",
    "too-many-public-methods",
    "consider-using-in",
    "consider-using-max-builtin",
    "protected-access",
    "unused-argument",
    "exec-used",
    "duplicate-code",
]
